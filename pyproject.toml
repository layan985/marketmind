[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmind"
version = "0.1.0"
description = "Market-regime research through fractal, information-theoretic, and financial-network measures"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Layan Oraidi" }]
keywords = [
  "financial markets",
  "market regimes",
  "information theory",
  "transfer entropy",
  "fractal analysis",
  "network science",
  "technical analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dashboard = ["plotly>=5.20", "streamlit>=1.35"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
test = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "twine>=5.1",
  "types-PyYAML>=6.0",
]
all = [
  "build>=1.2",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "plotly>=5.20",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "streamlit>=1.35",
  "twine>=5.1",
  "types-PyYAML>=6.0",
  "yfinance>=0.2.40",
]

[project.scripts]
marketmind = "marketmind.cli:main"
marketmind-dashboard = "marketmind.dashboard:launch"

[project.urls]
Documentation = "https://layan985.github.io/marketmind/"
Issues = "https://github.com/layan985/marketmind/issues"
Repository = "https://github.com/layan985/marketmind"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=marketmind --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["marketmind"]
omit = ["*/marketmind/dashboard.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise ImportError",
]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["marketmind"]
