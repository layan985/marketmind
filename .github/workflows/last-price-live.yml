name: Last Price live open-model pilot
on:
  workflow_dispatch:
  push:
    branches: [last-price-execution-20260810]
    paths:
      - 'experiments/last_price_ollama.py'
      - '.github/workflows/last-price-live.yml'
permissions:
  contents: read
jobs:
  live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
      - name: Pull frozen model tags
        run: |
          ollama pull qwen3:0.6b
          ollama pull qwen3:1.7b
          ollama pull gemma3:1b
          ollama pull llama3.2:1b
          ollama list
      - name: Run real model negotiations
        run: python experiments/last_price_ollama.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: last-price-live-results
          path: artifacts/
          if-no-files-found: error
