name: Public benchmark evidence bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MarketMind with data dependencies
        run: python -m pip install ".[data,test]"
      - name: Run frozen historical public benchmark
        run: python scripts/run_public_benchmark.py --output public-benchmark-bundle
      - name: Verify bundle manifest exists
        run: test -f public-benchmark-bundle/artifact_manifest.json
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: marketmind-public-benchmark-${{ github.sha }}
          path: public-benchmark-bundle/
          if-no-files-found: error
          retention-days: 90
