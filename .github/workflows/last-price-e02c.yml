name: Last Price E02-C protocol robustness

on:
  push:
    branches: [last-price-e02c-protocol-robustness-20260810]
    paths:
      - 'experiments/E02C_FREEZE.json'

permissions:
  contents: read

jobs:
  negotiate:
    name: ${{ matrix.buyer_label }}-${{ matrix.product_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: headphones}
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: suitcase}
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: chair}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: headphones}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: suitcase}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: chair}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: headphones}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: suitcase}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: chair}

    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          freeze = json.load(open('experiments/E02C_FREEZE.json'))
          for path, expected in freeze['sha256'].items():
              actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {path}: {actual} != {expected}')
          print('E02-C freeze hashes PASS')
          PY

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull frozen model tags
        run: |
          ollama pull qwen3:4b
          ollama pull '${{ matrix.buyer_model }}'
          mkdir -p 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}'
          ollama list | tee 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/model_registry.txt'
          ollama show qwen3:4b --modelfile > 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/seller_modelfile.txt'
          ollama show '${{ matrix.buyer_model }}' --modelfile > 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/buyer_modelfile.txt'
          cp experiments/E02C_PROTOCOL.md 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/E02C_PROTOCOL.md'
          cp experiments/E02C_FREEZE.json 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/E02C_FREEZE.json'

      - name: Run frozen protocol-robustness negotiations
        env:
          BUYER_LABEL: ${{ matrix.buyer_label }}
          BUYER_MODEL: ${{ matrix.buyer_model }}
          PRODUCT_ID: ${{ matrix.product_id }}
          N_SEEDS: '3'
        run: python -m experiments.last_price_e02c_driver

      - name: Upload cell evidence
        uses: actions/upload-artifact@v4
        with:
          name: e02c-${{ matrix.buyer_label }}-${{ matrix.product_id }}
          path: artifacts/
          if-no-files-found: error

  aggregate:
    name: frozen-analysis
    needs: negotiate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e02c-*
          path: collected
          merge-multiple: true
      - run: python -m pip install --quiet scipy
      - run: python experiments/last_price_e02c_aggregate.py
      - run: |
          cp experiments/E02C_PROTOCOL.md aggregate/
          cp experiments/E02C_FREEZE.json aggregate/
      - uses: actions/upload-artifact@v4
        with:
          name: e02c-aggregate-report
          path: aggregate/
          if-no-files-found: error
