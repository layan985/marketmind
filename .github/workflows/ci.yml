name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install ".[test]"
      - name: Run test suite
        run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install ".[test,docs]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/marketmind
      - name: Validate research registry
        run: python tools/validate_research_registry.py
      - name: Validate public HTML
        run: npx --yes html-validate@11.6.2 web/*.html
      - name: Run controlled research audit
        run: marketmind audit --output /tmp/marketmind-audit --periods 640 --assets 4 --window 64 --step 16
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
