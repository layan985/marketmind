name: Publish MarketMind v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version metadata
        run: |
          grep -q 'version = "0.2.0"' pyproject.toml
          grep -q '^version: 0.2.0$' CITATION.cff
          test -f RELEASE_NOTES_v0.2.0.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists; nothing to do.'
          else
            gh release create v0.2.0 \
              --target "${GITHUB_SHA}" \
              --title 'MarketMind 0.2.0 — Executable Study and Controlled Audit' \
              --notes-file RELEASE_NOTES_v0.2.0.md \
              --latest
          fi
