name: Publish MarketMind v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version metadata
        run: |
          grep -q 'version = "0.2.0"' pyproject.toml
          grep -q '^version: 0.2.0$' CITATION.cff
          test -f RELEASE_NOTES_v0.2.0.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists; nothing to do.'
          else
            gh release create v0.2.0 \
              --target "${GITHUB_SHA}" \
              --title 'MarketMind 0.2.0 — Executable Study and Controlled Audit' \
              --notes-file RELEASE_NOTES_v0.2.0.md \
              --latest
          fi

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-v0.2.0
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/marketmind
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-v0.2.0
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
