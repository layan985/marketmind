name: Last Price E02-D constrained schema

on:
  push:
    branches: [last-price-e02d-constrained-schema-20260810]
    paths:
      - 'experiments/E02D_FREEZE.json'

permissions:
  contents: read

jobs:
  negotiate:
    name: ${{ matrix.buyer_label }}-${{ matrix.product_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: headphones}
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: suitcase}
          - {buyer_label: qwen17, buyer_model: 'qwen3:1.7b', product_id: chair}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: headphones}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: suitcase}
          - {buyer_label: gemma4, buyer_model: 'gemma3:4b', product_id: chair}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: headphones}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: suitcase}
          - {buyer_label: llama3, buyer_model: 'llama3.2:3b', product_id: chair}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen commit
        run: |
          python - <<'PY'
          import json, subprocess
          freeze = json.load(open('experiments/E02D_FREEZE.json'))
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'], text=True).splitlines()
          if parent != freeze['frozen_commit']:
              raise SystemExit(f"frozen parent mismatch: {parent} != {freeze['frozen_commit']}")
          if changed != ['experiments/E02D_FREEZE.json']:
              raise SystemExit(f"trigger commit changed unexpected files: {changed}")
          print('E02-D frozen commit PASS', parent)
          PY

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull frozen model tags and record manifest
        run: |
          ollama pull qwen3:4b
          ollama pull '${{ matrix.buyer_model }}'
          mkdir -p 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}'
          ollama list | tee 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/model_registry.txt'
          ollama show qwen3:4b --modelfile > 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/seller_modelfile.txt'
          ollama show '${{ matrix.buyer_model }}' --modelfile > 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/buyer_modelfile.txt'
          cp experiments/E02D_PROTOCOL.md 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/E02D_PROTOCOL.md'
          cp experiments/E02D_FREEZE.json 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/E02D_FREEZE.json'
          {
            echo "trigger_commit=$(git rev-parse HEAD)"
            echo "frozen_commit=$(git rev-parse HEAD^)"
            sha256sum experiments/E02D_PROTOCOL.md experiments/last_price_e02d_driver.py experiments/last_price_e02d_aggregate.py .github/workflows/last-price-e02d.yml
          } > 'artifacts/${{ matrix.buyer_label }}-${{ matrix.product_id }}/FROZEN_MANIFEST.txt'

      - name: Run frozen constrained-schema negotiations
        env:
          BUYER_LABEL: ${{ matrix.buyer_label }}
          BUYER_MODEL: ${{ matrix.buyer_model }}
          PRODUCT_ID: ${{ matrix.product_id }}
          N_SEEDS: '3'
        run: python -m experiments.last_price_e02d_driver

      - name: Upload cell evidence
        uses: actions/upload-artifact@v4
        with:
          name: e02d-${{ matrix.buyer_label }}-${{ matrix.product_id }}
          path: artifacts/
          if-no-files-found: error

  aggregate:
    name: frozen-analysis
    needs: negotiate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e02d-*
          path: collected
          merge-multiple: true
      - run: python -m pip install --quiet scipy
      - run: python experiments/last_price_e02d_aggregate.py
      - run: |
          cp experiments/E02D_PROTOCOL.md aggregate/
          cp experiments/E02D_FREEZE.json aggregate/
      - uses: actions/upload-artifact@v4
        with:
          name: e02d-aggregate-report
          path: aggregate/
          if-no-files-found: error
