name: Bug report
description: Report a reproducible numerical or software defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials or licensed market data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MarketMind and Python versions
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Data shape and provenance
      description: Describe provider, date range, columns, and manifest hash without sharing restricted data.

