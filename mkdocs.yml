site_name: MarketMind
site_description: Multiscale market intelligence research software
site_url: https://layan985.github.io/marketmind/
repo_url: https://github.com/layan985/marketmind
repo_name: layan985/marketmind
copyright: Copyright © 2026 Layan Oraidi

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Methodology: methodology.md
  - Data and reproducibility: data.md
  - Walk-forward evaluation: evaluation.md
  - Validation: validation.md
  - Dashboard: dashboard.md
  - API:
      - MII: api/mii.md
      - Fractal measures: api/fractal.md
      - Information theory: api/information.md
      - Networks: api/networks.md
      - Indicators and backtests: api/evaluation.md
      - Data pipeline: api/data.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

strict: true
