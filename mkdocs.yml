site_name: MarketMind Research
site_description: Open research infrastructure for market organization, regimes, and information dynamics
site_url: https://marketmind-hazel.vercel.app/
repo_url: https://github.com/layan985/marketmind
repo_name: layan985/marketmind
copyright: Copyright © 2026 Layan Oraidi

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/pixel.css

nav:
  - Overview: index.md
  - Research: research-program.md
  - Software: software.md
  - Benchmarks: benchmarks.md
  - Validation:
      - Validation register: validation.md
      - Controlled research audit: research-audit.md
  - Datasets: datasets.md
  - Experiments: experiments.md
  - Applications: applications.md
  - Publications: publications.md
  - Methods: methodology.md
  - Documentation:
      - Quickstart: quickstart.md
      - Data and reproducibility: data.md
      - Walk-forward evaluation: evaluation.md
      - Dashboard: dashboard.md
      - API:
          - MII: api/mii.md
          - Fractal measures: api/fractal.md
          - Information theory: api/information.md
          - Networks: api/networks.md
          - Indicators and backtests: api/evaluation.md
          - Prospective study: api/study.md
          - Data pipeline: api/data.md
  - People: people.md
  - Institutional Work: institutional-work.md
  - Governance: governance.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

strict: true